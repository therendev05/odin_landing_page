<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="headerLogo">
            <a href="#"><img src="images/minecraftLogo.png" alt="Minecraft Logo"></a>
        </div>

        <div class="headerLinks">
            <ul>
                <li><a href="">Overworld</a></li>
                <li><a href="">Nether</a></li>
                <li><a href="">End</a></li>
            </ul>
        </div>
    </div>

    <div class="heroContainer">
        <div class="heroLeft">
            <div class="heroTitle">
                <h1>This is Minecraft!</h1>
            </div>

            <div class="heroText">
                <p>
                    Minecraft it's the best game ever! <br>
                    You can build, explore, get lost in caves and much more.
                </p>
            </div>

            <div class="heroButton">
                <button>Sign up</button>
            </div>
        </div>

        <div class="heroRight">
            <div class="heroImage">
                <img src="images/minecraftBoxImage.jpg" alt="Minecraft View">
            </div>
        </div>
    </div>
    
</body>
</html>
